<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cool Tree Universe</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🌌 PARALLAX -->
<div class="parallax">
  <div class="layer back"></div>
  <div class="layer mid"></div>
  <div class="layer front"></div>
</div>

<!-- ☁️ Clouds -->
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<!-- 🌧️ Rain -->
<div class="rain"></div>

<!-- Lightning  -->
<svg class="lightning-svg"></svg>

<!-- 🚀 HERO -->
<section class="hero text-center text-light d-flex align-items-center justify-content-center">
  <div>
    <h5 class="display-5 fw-bold">The Main Course </h5>
    <h1 class="display-4 fw-bold main-course">Strategy Mastery Course</h1>
    <p class="lead" style="color: rgb(86, 223, 7)">The Mechanical Strategy </p>
  </div>
</section>


<!-- 🌐 FOOTER -->
<footer class="text-center py-4" style="background: rgba(0,0,0,0.8);">

  <p class="mb-3" style="color: rgb(2, 255, 2); font-weight: bold;">Connect With Me</p>

  <div class="d-flex justify-content-center gap-4 fs-3">

    <a href="https://www.youtube.com" class="text-success"><i class="bi bi-youtube"></i></a>
    <a href="https://www.x.com" class="text-success"><i class="bi bi-twitter-x"></i></a>
    <a href="https://www.instagram.com" class="text-success"><i class="bi bi-instagram"></i></a>
    <a href="#" class="text-success"><i class="bi bi-telegram"></i></a>

  </div>


</footer>

<script src="script.js"></script>

<script>
/* 🌧️ Rain Generator */
const rain = document.querySelector('.rain');
for (let i = 0; i < 120; i++) {
  let drop = document.createElement('div');
  drop.classList.add('drop');
  drop.style.left = Math.random() * 100 + "vw";
  drop.style.animationDuration = (0.5 + Math.random()) + "s";
  rain.appendChild(drop);
}
</script>

</body>
</html>
