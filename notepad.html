<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07100e">
<title>Cool Tree Universe | Notepad</title>
<style>
:root {
  color-scheme: dark;
  --bg: #07100e;
  --paper: #0a1512;
  --line: rgba(159, 190, 164, .22);
  --accent: #079e07;
  --text: #009b0d;
  --muted: #078518;
  --line-height: 42px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 28px clamp(14px, 4vw, 56px);
  background: radial-gradient(ellipse at top, #11211a 0%, var(--bg) 58%);
  color: var(--text);
  font-family: "Segoe UI", system-ui, sans-serif;
}
.page { max-width: 1120px; margin: 0 auto; }
header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; margin: 0 auto 18px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 13px; }
.tree {
  width: 42px; height: 42px; color: var(--accent); flex: 0 0 auto;
  filter: drop-shadow(0 0 8px rgba(184,216,120,.18));
}
.brand-name { color: var(--accent); font-size: clamp(18px, 2.4vw, 25px); font-weight: 600; letter-spacing: .2px; }
.brand-sub { margin-top: 3px; color: var(--muted); font-size: 11px; letter-spacing: 4px; }
.date { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.date input {
  width: 155px; color: var(--text); background: transparent;
  border: 0; border-bottom: 1px solid #435a45; padding: 8px 2px; outline: none;
  font: inherit;
}
.date input:focus, .page-title:focus { border-color: var(--accent); }
.toolbar {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; flex-wrap: wrap; margin: 0 0 12px;
}
.page-title {
  min-width: 160px; flex: 1; background: transparent; border: 0;
  border-bottom: 1px solid transparent; outline: none; color: var(--text);
  font: 500 16px "Segoe UI", system-ui, sans-serif; padding: 8px 2px;
}
.page-title::placeholder { color: #718176; }
.controls { display: flex; gap: 7px; flex-wrap: wrap; }
button {
  border: 1px solid #304936; border-radius: 999px; background: #0c1a14;
  color: #028809; padding: 8px 12px; font: 13px "Segoe UI", system-ui, sans-serif;
  cursor: pointer; transition: border-color .2s, color .2s, background .2s;
}
button:hover, button:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
.paper {
  position: relative; overflow: hidden; min-height: min(75vh, 900px);
  border: 1px solid #2d4934; border-radius: 22px;
  background: linear-gradient(145deg, rgba(12,26,21,.97), rgba(7,17,14,.98));
  box-shadow: 0 22px 70px rgba(0,0,0,.2), inset 0 0 35px rgba(105,145,92,.025);
}
.paper::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 57px;
  width: 1px; background: rgba(184,216,120,.48); pointer-events: none; z-index: 1;
}
.writing-area {
  display: block; width: 100%; height: min(75vh, 900px); min-height: 520px;
  resize: vertical; border: 0; outline: 0; background-color: transparent;
  color: #169b04; caret-color: var(--accent);
  padding: 0 28px 30px 78px;
  font: 20px/var(--line-height) "Segoe UI", system-ui, sans-serif;
  /* Local attachment makes ruled lines scroll with textarea content in supporting browsers. */
  background-image: repeating-linear-gradient(
    to bottom, transparent 0, transparent calc(var(--line-height) - 1px),
    var(--line) calc(var(--line-height) - 1px), var(--line) var(--line-height)
  );
  background-attachment: local;
  background-position: 0 0;
  background-size: 100% var(--line-height);
}
.writing-area::placeholder { color: #617267; }
footer {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 14px 4px 0; color: #91a096; font-size: 12px;
}
.status { display: flex; align-items: center; gap: 8px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.footer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
body.focus-mode { padding-top: 14px; padding-bottom: 14px; }
body.focus-mode header, body.focus-mode footer { display: none; }
body.focus-mode .toolbar { margin-bottom: 10px; }
body.focus-mode .paper, body.focus-mode .writing-area { height: calc(100vh - 100px); max-height: none; }
@media (max-width: 560px) {
  body { padding: 18px 12px; }
  header { align-items: flex-start; }
  .date { width: 100%; }
  .date input { flex: 1; min-width: 0; }
  .paper { border-radius: 15px; min-height: 72vh; }
  .paper::before { left: 35px; }
  .writing-area {
    height: 72vh; min-height: 480px; padding-left: 50px; padding-right: 15px;
    font-size: 18px;
  }
  footer { align-items: flex-start; flex-direction: column; }
  .toolbar { align-items: stretch; }
  .controls { justify-content: flex-start; }
}
</style>
</head>
<body>
<main class="page">
  <header>
    <div class="brand">
      <svg class="tree" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M32 57V29M32 43L19 32M32 38L45 25M32 49L45 39M32 34L22 21"/>
        <path d="M31 30C20 31 12 24 15 16C16 9 24 8 29 13C29 4 39 3 43 11C52 9 57 18 51 25C48 31 40 32 32 30Z"/>
        <path d="M20 16L28 25M43 13L36 24M50 22L39 28M17 22L27 29M22 58H42"/>
      </svg>
      <div>
        <div class="brand-name">Cool Tree Universe</div>
        <div class="brand-sub">NOTEPAD</div>
      </div>
    </div>
    <label class="date" for="noteDate">
      <span aria-hidden="true">▦</span><span>Date:</span>
      <input id="noteDate" type="date" aria-label="Note date">
    </label>
  </header>

  <section class="toolbar" aria-label="Notepad controls">
    <input id="pageTitle" class="page-title" type="text" placeholder="Untitled page" aria-label="Page title">
    <div class="controls">
      <button id="smallerBtn" type="button" aria-label="Decrease text size">A−</button>
      <button id="largerBtn" type="button" aria-label="Increase text size">A+</button>
      <button id="focusBtn" type="button" aria-pressed="false">Focus mode</button>
    </div>
  </section>

  <section class="paper" aria-label="Ruled notepad">
    <textarea id="note" class="writing-area" aria-label="Write your notes here" placeholder="Start writing..."></textarea>
  </section>

  <footer>
    <div class="status"><span class="status-dot"></span><span id="status">Ready to write</span></div>
    <div class="footer-actions">
      <button id="clearBtn" type="button">Clear page</button>
      <button id="downloadBtn" type="button">Save .txt</button>
    </div>
  </footer>
</main>
<script>
(() => {
  const note = document.getElementById('note');
  const dateInput = document.getElementById('noteDate');
  const titleInput = document.getElementById('pageTitle');
  const status = document.getElementById('status');
  const root = document.documentElement;
  const storageKey = 'coolTreeNotepadText';
  const dateKey = 'coolTreeNotepadDate';
  const titleKey = 'coolTreeNotepadTitle';
  const sizeKey = 'coolTreeNotepadFontSize';
  let fontSize = 20;
  let saveTimer;

  const todayLocal = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };

  try {
    note.value = localStorage.getItem(storageKey) || '';
    dateInput.value = localStorage.getItem(dateKey) || todayLocal();
    titleInput.value = localStorage.getItem(titleKey) || '';
    fontSize = Math.max(14, Math.min(30, Number(localStorage.getItem(sizeKey)) || 20));
  } catch (e) {
    dateInput.value = todayLocal();
  }

  function applyFontSize() {
    root.style.setProperty('--line-height', `${fontSize + 22}px`);
    note.style.fontSize = `${fontSize}px`;
    status.textContent = `Text size: ${fontSize}px`;
    try { localStorage.setItem(sizeKey, String(fontSize)); } catch (e) {}
  }
  applyFontSize();

  function saveNote() {
    status.textContent = 'Saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(storageKey, note.value);
        localStorage.setItem(dateKey, dateInput.value);
        localStorage.setItem(titleKey, titleInput.value);
        status.textContent = 'All changes saved in this browser';
      } catch (e) {
        status.textContent = 'Could not save in this browser';
      }
    }, 180);
  }
  note.addEventListener('input', saveNote);
  titleInput.addEventListener('input', saveNote);
  dateInput.addEventListener('change', saveNote);

  document.getElementById('smallerBtn').addEventListener('click', () => {
    fontSize = Math.max(14, fontSize - 2);
    applyFontSize();
  });
  document.getElementById('largerBtn').addEventListener('click', () => {
    fontSize = Math.min(30, fontSize + 2);
    applyFontSize();
  });

  const focusBtn = document.getElementById('focusBtn');
  focusBtn.addEventListener('click', () => {
    const enabled = document.body.classList.toggle('focus-mode');
    focusBtn.textContent = enabled ? 'Exit focus' : 'Focus mode';
    focusBtn.setAttribute('aria-pressed', String(enabled));
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (note.value && confirm('Clear everything on this page?')) {
      note.value = '';
      saveNote();
      note.focus();
    }
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const content = `Cool Tree Universe — Notepad\nTitle: ${titleInput.value || 'Untitled page'}\nDate: ${dateInput.value || ''}\n\n${note.value}`;
    const blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `cool-tree-note-${dateInput.value || 'undated'}.txt`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
})();
</script>
</body>
</html>
